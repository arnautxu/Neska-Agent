# Neska web search, all on the client's Hetzner server: no outside search API or key.
#   searxng    finds pages (metasearch over Google, Bing, Brave, DuckDuckGo...; AGPL-3.0)
#   firecrawl  opens them and returns clean text (AGPL-3.0, self-hosted, no auth), with its
#              own playwright, redis, rabbitmq and postgres queue
#   reranker   picks the chunks of each page that answer the question (reranker.py, BM25)
# LibreChat reaches them over the app network as http://searxng:8080,
# http://firecrawl:3002 and http://reranker:8890 (see webSearch in librechat.yaml).
# Nothing here publishes a port.
#   docker compose --env-file /etc/neska/<client>/cerca.env -f docker-compose.yml up -d
name: neska-${NESKA_CLIENT:?set NESKA_CLIENT}-cerca

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

x-firecrawl-env: &firecrawl-env
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright:3000/scrape
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?set FIRECRAWL_POSTGRES_PASSWORD}
  POSTGRES_DB: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: '5432'
  USE_DB_AUTHENTICATION: 'false'
  # Sized for one CAX21 that also runs the app and the code sandbox.
  NUM_WORKERS_PER_QUEUE: '2'
  CRAWL_CONCURRENT_REQUESTS: '4'
  MAX_CONCURRENT_JOBS: '4'
  BROWSER_POOL_SIZE: '2'

services:
  searxng:
    image: searxng/searxng@sha256:71a410e383ea1c1f973a0c38e566757c1f0c5f3976a33be2c70918fcd93bdcc7
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    logging: *logging
    networks:
      default: {}
      app: {aliases: [searxng]}

  reranker:
    image: python@sha256:1e1f6334529d1fb26a2ef619d7cffb30a7c7d7cc1cc7338ebee283a58d1aeaca  # 3.13-alpine
    restart: unless-stopped
    command: python -I /srv/reranker.py
    environment: {HOST: 0.0.0.0, PORT: '8890'}
    volumes:
      - ./reranker.py:/srv/reranker.py:ro
    read_only: true
    user: '65534:65534'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    logging: *logging
    networks:
      default: {}
      app: {aliases: [reranker]}

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl@sha256:0f1cfc844176f536e618ab0545223c234f7e538c8e264d19622652e4e5c7f218
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    environment:
      <<: *firecrawl-env
      HOST: 0.0.0.0
      PORT: '3002'
      EXTRACT_WORKER_PORT: '3004'
      WORKER_PORT: '3005'
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      ENV: local
    ulimits: {nofile: {soft: 65535, hard: 65535}}
    depends_on:
      redis: {condition: service_started}
      playwright: {condition: service_started}
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
    mem_limit: 2500m
    logging: *logging
    networks:
      default: {}
      app: {aliases: [firecrawl]}

  playwright:
    image: ghcr.io/firecrawl/playwright-service@sha256:eacaf2c256a6ff7fd1869e470d2969e97a037ff6c75ac01d38784d138a33f8eb
    restart: unless-stopped
    environment: {PORT: '3000', MAX_CONCURRENT_PAGES: '4', BLOCK_MEDIA: 'true'}
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    tmpfs: ['/tmp/.cache:noexec,nosuid,size=512m']
    mem_limit: 1g
    logging: *logging

  redis:
    image: redis@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    command: redis-server --save '' --appendonly no
    mem_limit: 128m
    logging: *logging

  rabbitmq:
    image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    restart: unless-stopped
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    logging: *logging

  postgres:
    image: ghcr.io/firecrawl/nuq-postgres@sha256:d719b36160eac2fcbe16dc7e7360ddb9c82c40ea5da183d07bf4a755c6a0b2ae
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:?set FIRECRAWL_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ${NESKA_DATA:?set NESKA_DATA}/cerca/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    logging: *logging

networks:
  # The Neska app stack's default network (compose project neska-<client>).
  app:
    external: true
    name: neska-${NESKA_CLIENT}_default
