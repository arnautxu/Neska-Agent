# Neska code sandbox: LibreChat Code Interpreter (github.com/ClickHouse/code-interpreter,
# Apache 2.0) next to the Neska app on the same Hetzner server. It is what lets Neska run
# Python to create and edit PowerPoint, Excel and Word files.
#
# Hetzner cloud servers have no /dev/kvm, so the sandbox runs in direct NsJail mode
# (namespaces + cgroups + seccomp) instead of microVMs. The runtime packages (Python with
# python-pptx, openpyxl, pandas, matplotlib...) live in ${CODEAPI_PKGS} and are built once
# with the upstream build-packages.sh.
#
# Joins the app's compose network so LibreChat reaches it at http://codeapi:3112.
# Nothing here publishes a port to the internet.
#   docker compose --env-file /etc/neska/<client>/code.env -f docker-compose.yml up -d
name: neska-${NESKA_CLIENT:?set NESKA_CLIENT}-code

x-redis: &redis
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD:?set CODEAPI_REDIS_PASSWORD}
  CODEAPI_INTERNAL_SERVICE_TOKEN: ${CODEAPI_INTERNAL_SERVICE_TOKEN:?set CODEAPI_INTERNAL_SERVICE_TOKEN}

x-auth: &auth
  LOCAL_MODE: 'false'
  CODEAPI_HARDENED_SANDBOX_MODE: 'true'
  CODEAPI_AUTH_PROVIDER: librechat-jwt
  CODEAPI_JWT_ISSUER: librechat
  CODEAPI_JWT_AUDIENCE: codeapi
  CODEAPI_JWT_ALLOWED_ALGS: EdDSA
  CODEAPI_JWT_KID: neska-codeapi-1
  CODEAPI_JWT_PUBLIC_KEY: ${CODEAPI_JWT_PUBLIC_KEY:?set CODEAPI_JWT_PUBLIC_KEY}
  CODEAPI_JWT_SINGLE_TENANT_ID: legacy
  # Remote bridge (operator-owned VMs) is not used by Neska.
  CODEAPI_BRIDGE_DYNAMIC_WORKERS: 'false'

services:
  api:
    image: ${CODEAPI_REGISTRY:-ghcr.io/librechat-ai}/code-interpreter-api:${CODEAPI_IMAGE_TAG:?set CODEAPI_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: [*redis, *auth]
      SERVICE_PORT: '3112'
      CODEAPI_HTTP_JSON_LIMIT: 50mb
      SANDBOX_ENDPOINT: http://sandbox-runner:2000/api/v2
      EGRESS_GATEWAY_URL: http://egress_gateway:3190
      FILE_SERVER_URL: http://file_server:3000
      TOOL_CALL_SERVER_URL: http://tool_call_server:3033
    depends_on: [redis, tool_call_server]
    networks:
      default: {}
      app:
        aliases: [codeapi]

  service-worker:
    image: ${CODEAPI_REGISTRY:-ghcr.io/librechat-ai}/code-interpreter-worker:${CODEAPI_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: [*redis, *auth]
      CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY: ${CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY:?set CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY}
      SANDBOX_ENDPOINT: http://sandbox-runner:2000/api/v2
      EGRESS_GATEWAY_URL: http://egress_gateway:3190
      PYTHON_CONCURRENCY: '2'
      OTHER_CONCURRENCY: '4'
      WORKER_HEALTH_PORT: '3113'
    depends_on:
      redis: { condition: service_started }
      sandbox-runner: { condition: service_healthy }

  egress_gateway:
    image: ${CODEAPI_REGISTRY:-ghcr.io/librechat-ai}/code-interpreter-egress-gateway:${CODEAPI_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *redis
      SERVICE_NAME: egress-gateway
      CODEAPI_HARDENED_SANDBOX_MODE: 'true'
      CODEAPI_EGRESS_LEDGER_REQUIRED: 'true'
      EGRESS_GATEWAY_PORT: '3190'
      EGRESS_GATEWAY_FILE_SERVER_URL: http://file_server:3000
      EGRESS_GATEWAY_TOOL_CALL_SERVER_URL: http://tool_call_server:3033
      EGRESS_GATEWAY_MAX_TOOL_CALL_BYTES: '1048576'
      CODEAPI_EGRESS_GRANT_SECRET: ${CODEAPI_EGRESS_GRANT_SECRET:?set CODEAPI_EGRESS_GRANT_SECRET}
    depends_on: [file_server, tool_call_server, redis]

  tool_call_server:
    image: ${CODEAPI_REGISTRY:-ghcr.io/librechat-ai}/code-interpreter-tool-call-server:${CODEAPI_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *redis
      TOOL_CALL_SERVER_PORT: '3033'
      TOOL_CALL_REQUEST_TIMEOUT: '300000'
      TOOL_CALL_SESSION_EXPIRY: '600'
    depends_on: [redis]

  sandbox-runner:
    image: ${CODEAPI_REGISTRY:-ghcr.io/librechat-ai}/code-interpreter-sandbox-runner-direct:${CODEAPI_IMAGE_TAG}
    restart: unless-stopped
    privileged: false
    mem_limit: 3g
    cpus: 2
    pids_limit: 2048
    security_opt:
      - seccomp=./nsjail-seccomp.json
    cap_add: [SYS_ADMIN, SYS_CHROOT, SYS_PTRACE, SETUID, SETGID, NET_ADMIN, DAC_OVERRIDE,
              DAC_READ_SEARCH, CHOWN, FOWNER, FSETID, KILL, SETFCAP, MKNOD]
    volumes:
      - ${CODEAPI_PKGS:?set CODEAPI_PKGS}:/host-packages:ro
    environment:
      KVM_ENABLED: 'false'
      # Docker gives the container a read-only cgroup tree, so NsJail cannot create per-job
      # cgroups. Jobs are still bounded by rlimits, the per-job timeouts below and the
      # container's own memory/CPU caps.
      SANDBOX_USE_CGROUPV2: 'false'
      CODEAPI_HARDENED_SANDBOX_MODE: 'true'
      EGRESS_GATEWAY_URL: http://egress_gateway:3190
      SANDBOX_EXECUTE_BODY_LIMIT: 50mb
      SANDBOX_PACKAGES_DIRECTORY: /pkgs
      SANDBOX_LOG_LEVEL: INFO
      SANDBOX_OUTPUT_MAX_SIZE: '65536'
      SANDBOX_MAX_CONCURRENT_JOBS: '4'
      SANDBOX_PER_JOB_UIDS: 'true'
      SANDBOX_JOB_UID_BASE: '200000'
      SANDBOX_JOB_GID_BASE: '200000'
      SANDBOX_WORKSPACE_REAPER_MAX_AGE_SECONDS: '3600'
      SANDBOX_RUN_TIMEOUT: '300000'
      SANDBOX_RUN_CPU_TIME: '300000'
      SANDBOX_COMPILE_TIMEOUT: '30000'
      SANDBOX_ALLOWED_LOCAL_NETWORK_PORT: '3190'
      SANDBOX_FORWARD_TARGET: egress_gateway:3190
      SANDBOX_REQUIRE_EGRESS_MANIFEST: 'true'
      SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY: ${SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY:?set SANDBOX_EXECUTION_MANIFEST_PUBLIC_KEY}
    depends_on:
      egress_gateway: { condition: service_started }
    healthcheck:
      # The direct (non-KVM) image has no healthcheck script; probe the runtimes route.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:2000/api/v2/runtimes').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  file_server:
    image: ${CODEAPI_REGISTRY:-ghcr.io/librechat-ai}/code-interpreter-file-server:${CODEAPI_IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *redis
      MINIO_BUCKET: neska-code
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${CODEAPI_MINIO_USER:?set CODEAPI_MINIO_USER}
      MINIO_SECRET_KEY: ${CODEAPI_MINIO_PASSWORD:?set CODEAPI_MINIO_PASSWORD}
      FILE_SERVER_PORT: '3000'
    # file_server gives up after ~10 tries if MinIO is not up yet, so wait for it.
    depends_on:
      minio: { condition: service_healthy }
      redis: { condition: service_started }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${CODEAPI_REDIS_PASSWORD}
    volumes:
      - ${CODEAPI_DATA:?set CODEAPI_DATA}/redis:/data

  minio:
    image: ${CODEAPI_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: ['server', '/data']
    # The image runs as uid 65532: create ${CODEAPI_DATA}/minio owned by 65532 (see README).
    environment:
      MINIO_ROOT_USER: ${CODEAPI_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${CODEAPI_MINIO_PASSWORD}
    volumes:
      - ${CODEAPI_DATA}/minio:/data
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9000']
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  # The Neska app stack's default network (compose project neska-<client>).
  app:
    external: true
    name: neska-${NESKA_CLIENT}_default
