# Neska on LibreChat: per-client configuration.
# Copied to /etc/neska/<client>/librechat.yaml on the client's Hetzner server.
version: 1.3.18
cache: true

interface:
  theme: neska
  customWelcome: 'Què fem avui?'
  landingFooter: false

# One assistant called Neska, on Claude. Each user enters their own Anthropic key
# in the model menu (ANTHROPIC_API_KEY=user_provided in neska.env).
# addedEndpoints keeps the Anthropic row in the menu, which is where the key is set.
modelSpecs:
  prioritize: true
  addedEndpoints: [anthropic]
  list:
    - name: neska
      label: Neska
      description: "L'agent de la teva empresa"
      iconURL: /assets/logo.svg
      default: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5

# Memory across conversations. Users see and delete what is kept under "Memòries"
# in the side panel. The memory agent runs on the user's own Anthropic key.
memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  agent:
    enabled: true
    provider: anthropic
    model: claude-haiku-5-5
    instructions: "Guarda només fets útils i duradors sobre l'usuari i la seva feina (preferències, rol, projectes). En català. Mai contrasenyes ni claus."
    model_parameters:
      temperature: 0.1
