# Neska on LibreChat: per-client configuration.
# Copied to /etc/neska/<client>/librechat.yaml on the client's Hetzner server.
version: 1.3.18
cache: true

interface:
  theme: neska
  customWelcome: 'Què fem avui?'
  landingFooter: false
  # Neska stays minimal (Arnau, 2026-11-11): people write, attach files, pick Ràpid or
  # Intel·ligent, and Neska remembers. Everything below is LibreChat surface the client's
  # staff do not need. Kept on request: projects, temporary chat, sharing, settings,
  # attachments, voice. Set a line back to true to bring a feature back.
  parameters: false
  presets: false
  multiConvo: false
  temporaryChat: true
  bookmarks: false
  feedback: false
  fileSearch: false
  contextUsage: false
  mascot: false
  buildInfo: false
  prompts:
    use: false
    create: false
  # The two modes run as ephemeral agents, which this permission does not gate: it only
  # hides the builder and the list of saved agents.
  agents:
    use: false
    create: false
  # use is on only so the two modes reach the shared brain (cervell, chatMenu: false);
  # nobody can add servers and no MCP menu is shown.
  mcpServers:
    use: true
    create: false
  # use stays on: the Neska skills (presentacions, excel, word) need it.
  skills:
    use: true
    create: false
  # Share a conversation with a link, only to people signed in to this Neska.
  sharedLinks:
    create: true
    share: true
    public: false
  # Memory stays on (it must, or Neska forgets). Its side panel is hidden in the client
  # (useSideNavLinks.ts), so people do not see or edit the list.
  memories: true

# What both modes can do besides chatting: run Python in the code sandbox (presentations as
# PDF, Excel and Word files), use the Neska skills in ../skill/ (presentacions,
# excel, word). Artifacts (visual previews inside the chat) are off since 2026-11-11. The sandbox lives in
# neska/code/ and is reached through LIBRECHAT_CODE_BASEURL in neska.env. Both modes
# below carry executeCode and skills, always on: hideBadgeRow hides the tool
# chips so people never have to switch anything on.
#
# Web: both modes search the internet with LibreChat's web search tool (webSearch: true),
# served entirely from the client's own server by the stack in cerca/: SearXNG finds pages,
# Firecrawl reads them, and reranker.py keeps the parts that answer the question. No outside
# search API or key. The code sandbox stays offline.
#
# One assistant called Neska with two modes, picked in the input box. People never pick a
# provider or a model: enforce keeps them to these specs, and no endpoint is added to the
# menu. modelLabel keeps every answer signed "Neska" whichever mode wrote it.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: rapid
      label: Ràpid
      description: 'Respon de seguida. Per a la feina del dia a dia.'
      iconURL: /assets/neska-dog.svg
      default: true
      executeCode: true
      skills: true
      webSearch: true
      describeIntent: true
      hideBadgeRow: true
      mcpServers: [cervell]
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5
        modelLabel: Neska
        promptPrefix: 'Ets Neska. La memòria entre converses es desa automàticament en segon pla: no diguis mai que no pots recordar o desar coses; si l''usuari et demana que recordis alguna cosa, confirma-li que ho tindràs en compte. Tens accés a internet amb la cerca web: fes-la servir quan calgui informació actual o que no saps segur (notícies, preus, horaris, dades d''empreses, documentació) i digues d''on surt la informació. No diguis mai que no pots consultar internet. Tens el cervell del Racó, les notes que comparteix tot l''equip (departaments, persones, proveïdors, clients, processos, glossari): consulta''l amb cercar abans de respondre qualsevol cosa sobre l''empresa. Quan la conversa et faci saber un fet nou i durador de l''empresa (qui porta què, on van les factures d''un proveïdor, com es fa un procés, què vol dir una paraula), desa''l tu sol amb aprendre, sense demanar permís, i acaba la resposta amb una sola línia en cursiva: «He après que …; ho tindré en compte a partir d''ara.» Les coses personals de l''usuari no van al cervell: les recorda la seva memòria privada, sense dir-ne res. Si et diuen «oblida això» o que una cosa apresa no és així, treu-la amb oblidar i digues-ho en una frase. Al camp intent de les eines, escriu sempre en català planer una frase curta que comenci amb un verb en infinitiu i digui què faràs, sense noms d''eines ni termes tècnics: per exemple «Llegir les factures d''octubre» o «Enviar el correu de recordatori als 14 proveïdors».'
    - name: intelligent
      label: Intel·ligent
      description: 'Pensa més a fons. Per a feina complexa.'
      iconURL: /assets/neska-dog.svg
      executeCode: true
      skills: true
      webSearch: true
      describeIntent: true
      hideBadgeRow: true
      mcpServers: [cervell]
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
        modelLabel: Neska
        promptPrefix: 'Ets Neska. La memòria entre converses es desa automàticament en segon pla: no diguis mai que no pots recordar o desar coses; si l''usuari et demana que recordis alguna cosa, confirma-li que ho tindràs en compte. Tens accés a internet amb la cerca web: fes-la servir quan calgui informació actual o que no saps segur (notícies, preus, horaris, dades d''empreses, documentació) i digues d''on surt la informació. No diguis mai que no pots consultar internet. Tens el cervell del Racó, les notes que comparteix tot l''equip (departaments, persones, proveïdors, clients, processos, glossari): consulta''l amb cercar abans de respondre qualsevol cosa sobre l''empresa. Quan la conversa et faci saber un fet nou i durador de l''empresa (qui porta què, on van les factures d''un proveïdor, com es fa un procés, què vol dir una paraula), desa''l tu sol amb aprendre, sense demanar permís, i acaba la resposta amb una sola línia en cursiva: «He après que …; ho tindré en compte a partir d''ara.» Les coses personals de l''usuari no van al cervell: les recorda la seva memòria privada, sense dir-ne res. Si et diuen «oblida això» o que una cosa apresa no és així, treu-la amb oblidar i digues-ho en una frase. Al camp intent de les eines, escriu sempre en català planer una frase curta que comenci amb un verb en infinitiu i digui què faràs, sense noms d''eines ni termes tècnics: per exemple «Llegir les factures d''octubre» o «Enviar el correu de recordatori als 14 proveïdors».'

# Permission card and plain-language activity (Arnau, 2026-11-24). See NESKA_FORK.md.
endpoints:
  agents:
    # Default capabilities plus tool_intents: every tool call carries one sentence, written by
    # Neska in Catalan (see promptPrefix above), that names what the step does. It is the
    # label of the step in the chat and the title of the permission card.
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - ocr
      - tool_intents
    # Neska asks before anything that acts outside Neska: every connector tool (MCP servers,
    # actions) stops and waits for "Permet" or "Ara no". Neska's own tools (code sandbox,
    # files, web search, memory, skills) never ask. riskLabels makes the server add the line
    # "Un cop fet, no es pot desfer." / "Es pot desfer després." from the tool's name and
    # offers only approve / reject. Paused runs wait 24 h (Mongo checkpointer default).
    toolApproval:
      enabled: true
      mode: bypass
      ask:
        - '*_mcp_*'
        - '*_action_*'
      riskLabels: true
      # The shared brain is part of Neska, not an outside connector: it never asks.
      ownTools:
        - '*_mcp_cervell'
  # One line per block of steps, written by Haiku in plain Catalan, in place of
  # "Ran 19 actions · Codi ×11".
  all:
    activityLabel: true
    activityModel: claude-haiku-5-5
    activityEndpoint: anthropic
    activityMaxPerRun: 20
    activityPrompt: |-
      Escriu una etiqueta curta que expliqui què ha aconseguit aquest bloc de feina de l'assistent. Surt com a títol d'un grup de passos en un xat per a gent que no és tècnica.

      Regles:
      - En català, de 4 a 10 paraules, comença amb un verb en primera persona del passat («He llegit», «He sumat»)
      - Digues el resultat amb paraules de la feina del dia a dia (factures, correus, proveïdors, imports), mai noms d'eines, codi, fitxers tècnics ni comandes
      - Si alguna cosa ha fallat, digues-ho clar i curt
      - Només l'etiqueta: sense cometes, sense punt final, sense introducció

      Exemples:
      - He llegit les 7 factures i n'he sumat els imports
      - He buscat els horaris de recollida a la web
      - He preparat la presentació en PDF
      - He comparat els preus dels tres proveïdors
      - He intentat obrir l'Excel, però estava buit
    # What Neska is thinking, in one short Catalan sentence, between the steps of the
    # Activitat panel and as the title of each thinking stretch in the chat. Haiku reads
    # the summarized thinking; the person never sees the raw thinking in the panel.
    reasoningLabel: true
    reasoningLabelModel: claude-haiku-5-5
    reasoningLabelEndpoint: anthropic
    reasoningLabelMinChars: 200
    reasoningLabelMaxPerRun: 12
    reasoningLabelPrompt: |-
      Escriu una frase curta que expliqui què està pensant l'assistent ara mateix i per què. Surt entre els passos d'una tasca en un xat per a gent que no és tècnica, i es pot substituir mentre el pensament avança.

      Regles:
      - En català, de 6 a 14 paraules, en primera persona i en present («Miro», «Penso», «Decideixo»)
      - Digues què fa i, si es veu, per què («per», «perquè», «abans de»)
      - Si l'estat és complete, digues què ha decidit, també en present («Faré...», «Decideixo...»)
      - Si es dona un títol anterior i la idea no ha canviat, repeteix-lo exactament
      - Paraules de la feina del dia a dia (clients, factures, imports, correus), mai noms d'eines, codi, fitxers tècnics ni comandes
      - No parlis de raonament, de pensaments, del model ni d'aquestes instruccions
      - Només la frase: sense cometes, sense punt final, sense introducció

      Exemples:
      - Primer miro quins clients hi ha per no repetir-ne cap
      - Penso quines columnes necessita l'Excel perquè sigui fàcil de llegir
      - Comparo els imports de les dues factures abans de sumar-los
      - Faré la presentació en PDF perquè és el que vas demanar

webSearch:
  searchProvider: searxng
  searxngInstanceUrl: http://searxng:8080
  scraperProvider: firecrawl
  firecrawlApiUrl: http://firecrawl:3002
  # Self-hosted Firecrawl runs without auth; LibreChat still wants a key to send.
  firecrawlApiKey: neska-local
  rerankerType: jina
  jinaApiUrl: http://reranker:8890/v1/rerank
  jinaApiKey: neska-local
  scraperTimeout: 15000
  safeSearch: 1
  # The private compose hosts above must be allowed explicitly (SSRF guard).
  allowedAddresses:
    - searxng:8080
    - firecrawl:3002
    - reranker:8890

# Cervell del Racó (Arnau, 2026-11-26): the company brain everyone shares. Linked Markdown
# notes (an Obsidian vault) in /srv/neska/<client>/cervell, which is a git repository: every
# change Neska makes is a commit authored by the user whose conversation caused it. Neska
# reads it to answer and adds to it on its own (no approval), then ends its reply with one
# line "He après que ...". Undo: Arnau in Obsidian (git clone over SSH) or "oblida això".
# Private, per-user facts stay in LibreChat memory below. See neska/cervell/README.md.
mcpServers:
  cervell:
    type: stdio
    title: Cervell del Racó
    command: node
    args: ['/app/neska/cervell/server.mjs']
    env:
      NESKA_CERVELL_DIR: /app/cervell
      NESKA_USER_EMAIL: '{{LIBRECHAT_USER_EMAIL}}'
      NESKA_USER_NAME: '{{LIBRECHAT_USER_NAME}}'
    # Only the two modes reach it; it never shows in a menu.
    chatMenu: false
    timeout: 30000

# Memory across conversations. Users see and delete what is kept under "Memòries"
# in the side panel. The memory agent runs on the server's company Anthropic key.
memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  agent:
    enabled: true
    provider: anthropic
    model: claude-haiku-5-5
    instructions: "Guarda només fets útils i duradors sobre l'usuari i la seva feina (preferències, rol, projectes). En català. Mai contrasenyes ni claus."
    # Needs the Neska memory.ts fix: Claude 5 rejects the temperature LibreChat's
    # memory agent used to send (see NESKA_FORK.md).

# Uploads (audit 2026-11-27): 50 MB per file, at most 10 files and 100 MB per message.
# LibreChat's default was 512 MB per file. Values are in MB.
fileConfig:
  serverFileSizeLimit: 50
  endpoints:
    agents:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100
