# Neska on LibreChat: per-client configuration.
# Copied to /etc/neska/<client>/librechat.yaml on the client's Hetzner server.
version: 1.3.18
cache: true

interface:
  theme: neska
  customWelcome: 'Què fem avui?'
  landingFooter: false
  # Neska stays minimal (Arnau, 2026-11-11): people write, attach files, pick Ràpid or
  # Intel·ligent, and Neska remembers. Everything below is LibreChat surface the client's
  # staff do not need. Nothing is removed from the code: set a line back to true to
  # bring that feature back.
  parameters: false
  presets: false
  multiConvo: false
  bookmarks: false
  temporaryChat: false
  feedback: false
  fileSearch: false
  contextUsage: false
  mascot: false
  buildInfo: false
  prompts:
    use: false
    create: false
  # The two modes run as ephemeral agents, which this permission does not gate: it only
  # hides the builder and the list of saved agents.
  agents:
    use: false
    create: false
  mcpServers:
    use: false
    create: false
  # use stays on: the Neska skills (presentacions, excel, word) need it.
  skills:
    use: true
    create: false
  sharedLinks:
    create: false
    share: false
    public: false
  # Kept on purpose: memories (people see and delete what Neska remembers).
  memories: true

# What both modes can do besides chatting: run Python in the code sandbox (presentations as
# PDF, Excel and Word files), use the Neska skills in ../skill/ (presentacions,
# excel, word) and draw artifacts (visual previews inside the chat). The sandbox lives in
# neska/code/ and is reached through LIBRECHAT_CODE_BASEURL in neska.env. Both modes
# below carry executeCode, skills and artifacts, always on: hideBadgeRow hides the tool
# chips so people never have to switch anything on.
#
# One assistant called Neska with two modes, picked in the input box. People never pick a
# provider or a model: enforce keeps them to these specs, and no endpoint is added to the
# menu. modelLabel keeps every answer signed "Neska" whichever mode wrote it.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: rapid
      label: Ràpid
      description: 'Respon de seguida. Per a la feina del dia a dia.'
      iconURL: /assets/neska-dog.svg
      default: true
      executeCode: true
      skills: true
      artifacts: default
      hideBadgeRow: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5
        modelLabel: Neska
        promptPrefix: 'Ets Neska. La memòria entre converses es desa automàticament en segon pla: no diguis mai que no pots recordar o desar coses; si l''usuari et demana que recordis alguna cosa, confirma-li que ho tindràs en compte.'
    - name: intelligent
      label: Intel·ligent
      description: 'Pensa més a fons. Per a feina complexa.'
      iconURL: /assets/neska-dog.svg
      executeCode: true
      skills: true
      artifacts: default
      hideBadgeRow: true
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
        modelLabel: Neska
        promptPrefix: 'Ets Neska. La memòria entre converses es desa automàticament en segon pla: no diguis mai que no pots recordar o desar coses; si l''usuari et demana que recordis alguna cosa, confirma-li que ho tindràs en compte.'

# Memory across conversations. Users see and delete what is kept under "Memòries"
# in the side panel. The memory agent runs on the server's company Anthropic key.
memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  agent:
    enabled: true
    provider: anthropic
    model: claude-haiku-5-5
    instructions: "Guarda només fets útils i duradors sobre l'usuari i la seva feina (preferències, rol, projectes). En català. Mai contrasenyes ni claus."
    # Needs the Neska memory.ts fix: Claude 5 rejects the temperature LibreChat's
    # memory agent used to send (see NESKA_FORK.md).

# Voice is off by default (Neska stays minimal): no dictation button in the input box and
# no read-aloud button under answers. Remove this block to bring both back.
speech:
  speechTab:
    speechToText: false
    textToSpeech: false
