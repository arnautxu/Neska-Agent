# Neska on LibreChat: per-client configuration.
# Copied to /etc/neska/<client>/librechat.yaml on the client's Hetzner server.
version: 1.3.18
cache: true

interface:
  theme: neska
  customWelcome: 'Què fem avui?'
  landingFooter: false
  # Neska stays minimal (Arnau, 2026-11-11): people write, attach files, pick Ràpid or
  # Intel·ligent, and Neska remembers. Everything below is LibreChat surface the client's
  # staff do not need. Kept on request: projects, temporary chat, sharing, settings,
  # attachments, voice. Set a line back to true to bring a feature back.
  parameters: false
  presets: false
  multiConvo: false
  temporaryChat: true
  bookmarks: false
  feedback: false
  fileSearch: false
  contextUsage: false
  mascot: false
  buildInfo: false
  prompts:
    use: false
    create: false
  # The two modes run as ephemeral agents, which this permission does not gate: it only
  # hides the builder and the list of saved agents.
  agents:
    use: false
    create: false
  mcpServers:
    use: false
    create: false
  # use stays on: the Neska skills (presentacions, excel, word) need it.
  skills:
    use: true
    create: false
  # Share a conversation with a link, only to people signed in to this Neska.
  sharedLinks:
    create: true
    share: true
    public: false
  # Memory stays on (it must, or Neska forgets). Its side panel is hidden in the client
  # (useSideNavLinks.ts), so people do not see or edit the list.
  memories: true

# What both modes can do besides chatting: run Python in the code sandbox (presentations as
# PDF, Excel and Word files), use the Neska skills in ../skill/ (presentacions,
# excel, word). Artifacts (visual previews inside the chat) are off since 2026-11-11. The sandbox lives in
# neska/code/ and is reached through LIBRECHAT_CODE_BASEURL in neska.env. Both modes
# below carry executeCode and skills, always on: hideBadgeRow hides the tool
# chips so people never have to switch anything on.
#
# Web: both modes search the internet with Claude's own web search tool (web_search: true in
# each preset). It runs on the same company Anthropic key, needs no other provider or key, and
# its sources show in the chat as the usual web search card. It must be allowed for the
# organisation in the Anthropic Console (Settings > Privacy). The code sandbox stays offline.
#
# One assistant called Neska with two modes, picked in the input box. People never pick a
# provider or a model: enforce keeps them to these specs, and no endpoint is added to the
# menu. modelLabel keeps every answer signed "Neska" whichever mode wrote it.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: rapid
      label: Ràpid
      description: 'Respon de seguida. Per a la feina del dia a dia.'
      iconURL: /assets/neska-dog.svg
      default: true
      executeCode: true
      skills: true
      hideBadgeRow: true
      preset:
        endpoint: anthropic
        model: claude-sonnet-5-5
        modelLabel: Neska
        web_search: true
        promptPrefix: 'Ets Neska. La memòria entre converses es desa automàticament en segon pla: no diguis mai que no pots recordar o desar coses; si l''usuari et demana que recordis alguna cosa, confirma-li que ho tindràs en compte. Tens accés a internet amb la cerca web: fes-la servir quan calgui informació actual o que no saps segur (notícies, preus, horaris, dades d''empreses, documentació) i digues d''on surt la informació. No diguis mai que no pots consultar internet.'
    - name: intelligent
      label: Intel·ligent
      description: 'Pensa més a fons. Per a feina complexa.'
      iconURL: /assets/neska-dog.svg
      executeCode: true
      skills: true
      hideBadgeRow: true
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
        modelLabel: Neska
        web_search: true
        promptPrefix: 'Ets Neska. La memòria entre converses es desa automàticament en segon pla: no diguis mai que no pots recordar o desar coses; si l''usuari et demana que recordis alguna cosa, confirma-li que ho tindràs en compte. Tens accés a internet amb la cerca web: fes-la servir quan calgui informació actual o que no saps segur (notícies, preus, horaris, dades d''empreses, documentació) i digues d''on surt la informació. No diguis mai que no pots consultar internet.'

# Memory across conversations. Users see and delete what is kept under "Memòries"
# in the side panel. The memory agent runs on the server's company Anthropic key.
memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  agent:
    enabled: true
    provider: anthropic
    model: claude-haiku-5-5
    instructions: "Guarda només fets útils i duradors sobre l'usuari i la seva feina (preferències, rol, projectes). En català. Mai contrasenyes ni claus."
    # Needs the Neska memory.ts fix: Claude 5 rejects the temperature LibreChat's
    # memory agent used to send (see NESKA_FORK.md).
